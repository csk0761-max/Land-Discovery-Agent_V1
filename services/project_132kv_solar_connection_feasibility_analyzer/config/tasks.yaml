    - Rank 132kV substations by immediate connection readiness
    - Assess bay availability and modification requirements
    - Evaluate 132kV-specific connection costs and economics
    - Analyze protection system requirements for solar integration
    - Consider 132kV grid code compliance and technical standards

    **Connection Strategy for 132kV:**
    - Optimal project sizing for 132kV connections (typically 10-50MW)
    - Bay sharing possibilities and dedicated connection requirements
    - 132kV-specific regulatory approval processes
    - Power evacuation assessment through 132kV network
    - Grid stability and power quality considerations

    **Infrastructure Development Impact:**
    - Future connection opportunities with bay additions
    - Timeline benefits of upcoming 132kV infrastructure projects
    - Cost advantages of connecting to expanding 132kV substations

    Present findings in clear format suitable for solar project developers focusing on 132kV voltage level opportunities.
  expected_output: "**EXECUTIVE SUMMARY - 132kV SOLAR CONNECTION OPPORTUNITIES**\nClear
    executive summary highlighting 132kV-specific advantages for {solar_capacity}
    MW solar connection\n\n**IMMEDIATE 132kV CONNECTION OPTIONS (Ready Now)**\nTable
    format with:\n- Rank | 132kV Substation Name | Available Bays | Connection Capacity
    | Feasibility Score | 132kV-Specific Advantages\n\n**FUTURE 132kV CONNECTION OPTIONS
    (Under Development)**  \nTable format with:\n- Rank | 132kV Substation Name |
    Development Status | Expected Completion | New Bay Capacity | Timeline Benefits\n\n**TOP
    3 IMMEDIATE 132kV RECOMMENDATIONS**\n1. [Substation Name]: Clear reason why it's
    #1 choice for 132kV connection\n2. [Substation Name]: Clear reason why it's #2
    choice for 132kV connection  \n3. [Substation Name]: Clear reason why it's #3
    choice for 132kV connection\n\n**TOP 3 FUTURE 132kV OPPORTUNITIES**\n1. [Substation
    Name]: Expected timeline and 132kV infrastructure benefits\n2. [Substation Name]:
    Expected timeline and 132kV infrastructure benefits\n3. [Substation Name]: Expected
    timeline and 132kV infrastructure benefits\n\n**132kV CONNECTION COST ESTIMATES**\n-
    Bay modification costs and timeline\n- 132kV-specific protection system requirements\n-
    Total connection cost range for 132kV integration\n- Regulatory approval timeline
    for 132kV connections\n\n**132kV-SPECIFIC ADVANTAGES**\n- Technical benefits of
    132kV connections vs other voltage levels\n- Economic advantages for projects
    in 10-50MW range\n- Grid stability and power quality benefits\n\n**NEXT STEPS
